<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
<title id="title">How a while Loop Repeats</title>
<desc id="desc">Test the condition before every pass; if true run the body and update, then return to the test; if false leave the loop.</desc>
<rect width="980" height="650" fill="#ffffff"/>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#334155" stroke-width="1.7"/></marker></defs>
<text x="490" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">How a while Loop Repeats</text>
<polyline points="490,138 490,184" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<polyline points="635,222 727,222 727,322" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<rect x="644" y="191" width="70" height="29" rx="6" fill="white"/>
<text x="679" y="211" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#172033">Yes</text>
<polyline points="345,222 222,222 222,322" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<rect x="255" y="191" width="70" height="29" rx="6" fill="white"/>
<text x="290" y="211" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#172033">No</text>
<polyline points="727,394 727,447" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<polyline points="577,481 520,481 520,293 490,293 490,261" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<rect x="347" y="76" width="286" height="62" rx="14" fill="#d6eaff" stroke="#334155" stroke-width="2.5"/>
<text x="490.0" y="113.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">Set space = 1</text>
<rect x="345" y="184" width="290" height="77" rx="14" fill="#fff3c4" stroke="#334155" stroke-width="2.5"/>
<text x="490.0" y="228.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">space &lt;= 3?</text>
<rect x="577" y="322" width="300" height="72" rx="14" fill="#d9f8e3" stroke="#334155" stroke-width="2.5"/>
<text x="727.0" y="364.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">Print Space number</text>
<rect x="577" y="447" width="300" height="68" rx="14" fill="#e9ddff" stroke="#334155" stroke-width="2.5"/>
<text x="727.0" y="487.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">space = space + 1</text>
<rect x="82" y="322" width="280" height="72" rx="14" fill="#d6eaff" stroke="#334155" stroke-width="2.5"/>
<text x="222.0" y="364.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">Print Done</text>
<text x="490" y="585" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">If the condition starts false, the body runs zero times.</text>
</svg>
