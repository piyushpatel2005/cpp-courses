<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc"><title id="title">Two rows in one sequence</title><desc id="desc">A two by three C array holds the first row before the second row in memory.</desc><rect width="1100" height="350" fill="#fffdf8"/><text x="550" y="55" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#172033">Two rows in one sequence</text><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs><rect x="38.0" y="108" width="143.2" height="134" rx="14" fill="#c3fae8" stroke="#273449" stroke-width="2.5"/><text x="109.6" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">row 0 col 0</text><text x="109.6" y="199" text-anchor="middle" font-family="monospace" font-size="17" fill="#172033">2</text><line x1="181.2" y1="175.0" x2="214.2" y2="175.0" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><rect x="214.2" y="108" width="143.2" height="134" rx="14" fill="#c3fae8" stroke="#273449" stroke-width="2.5"/><text x="285.8" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">row 0 col 1</text><text x="285.8" y="199" text-anchor="middle" font-family="monospace" font-size="17" fill="#172033">4</text><line x1="357.3" y1="175.0" x2="390.3" y2="175.0" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><rect x="390.3" y="108" width="143.2" height="134" rx="14" fill="#c3fae8" stroke="#273449" stroke-width="2.5"/><text x="461.9" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">row 0 col 2</text><text x="461.9" y="199" text-anchor="middle" font-family="monospace" font-size="17" fill="#172033">6</text><line x1="533.5" y1="175.0" x2="566.5" y2="175.0" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><rect x="566.5" y="108" width="143.2" height="134" rx="14" fill="#a5d8ff" stroke="#273449" stroke-width="2.5"/><text x="638.1" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">row 1 col 0</text><text x="638.1" y="199" text-anchor="middle" font-family="monospace" font-size="17" fill="#172033">1</text><line x1="709.7" y1="175.0" x2="742.7" y2="175.0" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><rect x="742.7" y="108" width="143.2" height="134" rx="14" fill="#a5d8ff" stroke="#273449" stroke-width="2.5"/><text x="814.2" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">row 1 col 1</text><text x="814.2" y="199" text-anchor="middle" font-family="monospace" font-size="17" fill="#172033">3</text><line x1="885.8" y1="175.0" x2="918.8" y2="175.0" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><rect x="918.8" y="108" width="143.2" height="134" rx="14" fill="#a5d8ff" stroke="#273449" stroke-width="2.5"/><text x="990.4" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">row 1 col 2</text><text x="990.4" y="199" text-anchor="middle" font-family="monospace" font-size="17" fill="#172033">5</text><text x="550" y="294" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#273449">Nested indexes name a row and a column; storage continues through row 0, then row 1.</text></svg>
