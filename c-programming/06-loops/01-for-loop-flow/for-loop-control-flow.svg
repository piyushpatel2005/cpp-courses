<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
<title id="title">How a for Loop Repeats</title>
<desc id="desc">Initialize once, test before each pass, run the body, update the counter, repeat the test, and exit when false.</desc>
<rect width="980" height="650" fill="#ffffff"/>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#334155" stroke-width="1.7"/></marker></defs>
<text x="490" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">How a for Loop Repeats</text>
<polyline points="490,141 490,193" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<polyline points="630,230 725,230 725,339" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<rect x="645" y="197" width="70" height="29" rx="6" fill="white"/>
<text x="680" y="217" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#172033">Yes</text>
<polyline points="350,230 220,230 220,339" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<rect x="257" y="197" width="70" height="29" rx="6" fill="white"/>
<text x="292" y="217" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#172033">No</text>
<polyline points="725,411 725,465" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<polyline points="575,500 520,500 520,303 490,303 490,268" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<rect x="350" y="77" width="280" height="64" rx="14" fill="#d6eaff" stroke="#334155" stroke-width="2.5"/>
<text x="490.0" y="115.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">Set box = 1</text>
<rect x="350" y="193" width="280" height="75" rx="14" fill="#fff3c4" stroke="#334155" stroke-width="2.5"/>
<text x="490.0" y="236.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">box &lt;= 3?</text>
<rect x="575" y="339" width="300" height="72" rx="14" fill="#d9f8e3" stroke="#334155" stroke-width="2.5"/>
<text x="725.0" y="381.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">Print Box number</text>
<rect x="575" y="465" width="300" height="70" rx="14" fill="#e9ddff" stroke="#334155" stroke-width="2.5"/>
<text x="725.0" y="506.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">box++</text>
<rect x="80" y="339" width="280" height="72" rx="14" fill="#d6eaff" stroke="#334155" stroke-width="2.5"/>
<text x="220.0" y="381.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">All boxes labeled</text>
<text x="490" y="585" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">The update happens after the body; the condition is checked again.</text>
</svg>
