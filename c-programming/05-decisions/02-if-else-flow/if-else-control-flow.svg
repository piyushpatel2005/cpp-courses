<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
<title id="title">How if and else Choose a Path</title>
<desc id="desc">A true condition leads to the if block, a false condition to the else block, and both branches join at the next statement.</desc>
<rect width="980" height="650" fill="#ffffff"/>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#334155" stroke-width="1.7"/></marker></defs>
<text x="490" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">How if and else Choose a Path</text>
<polyline points="490,138 490,180" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<polyline points="365,218 215,218 215,321" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<rect x="255" y="187" width="70" height="29" rx="6" fill="white"/>
<text x="290" y="207" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#172033">Yes</text>
<polyline points="615,218 765,218 765,321" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<rect x="653" y="187" width="70" height="29" rx="6" fill="white"/>
<text x="688" y="207" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#172033">No</text>
<polyline points="215,397 215,448 490,448 490,476" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<polyline points="765,397 765,448 645,448 645,512 635,512" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<rect x="390" y="76" width="200" height="62" rx="14" fill="#d6eaff" stroke="#334155" stroke-width="2.5"/>
<text x="490.0" y="113.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">Enter main</text>
<rect x="365" y="180" width="250" height="76" rx="14" fill="#fff3c4" stroke="#334155" stroke-width="2.5"/>
<text x="490.0" y="224.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">temperature &lt; 10?</text>
<rect x="75" y="321" width="280" height="76" rx="14" fill="#d9f8e3" stroke="#334155" stroke-width="2.5"/>
<text x="215.0" y="365.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">if: Bring a coat</text>
<rect x="625" y="321" width="280" height="76" rx="14" fill="#e9ddff" stroke="#334155" stroke-width="2.5"/>
<text x="765.0" y="365.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">else: Light layers</text>
<rect x="345" y="476" width="290" height="72" rx="14" fill="#d6eaff" stroke="#334155" stroke-width="2.5"/>
<text x="490.0" y="518.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">Check complete</text>
<text x="490" y="585" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">Exactly one branch executes, then execution continues below the if/else.</text>
</svg>
