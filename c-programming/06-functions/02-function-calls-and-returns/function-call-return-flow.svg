<svg xmlns="http://www.w3.org/2000/svg" width="980" height="650" viewBox="0 0 980 650" role="img" aria-labelledby="title desc">
<title id="title">How a Function Returns a Value</title>
<desc id="desc">Main pauses at the call, passes an argument, the function calculates and returns a value, and main resumes.</desc>
<rect width="980" height="650" fill="#ffffff"/>
<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#334155" stroke-width="1.7"/></marker></defs>
<text x="490" y="42" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#172033">How a Function Returns a Value</text>
<polyline points="393,187 579,187" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<rect x="451" y="136" width="70" height="29" rx="6" fill="white"/>
<text x="486" y="156" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#172033">Call</text>
<polyline points="745,238 745,319" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<polyline points="579,359 393,359" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<rect x="451" y="324" width="70" height="29" rx="6" fill="white"/>
<text x="486" y="344" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#172033">Return</text>
<polyline points="230,399 230,465" fill="none" stroke="#334155" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#tip)"/>
<rect x="68" y="143" width="325" height="95" rx="14" fill="#d6eaff" stroke="#334155" stroke-width="2.5"/>
<text x="230.5" y="183.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">main:</text>
<text x="230.5" y="209.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">result = double_points(4)</text>
<rect x="579" y="143" width="332" height="95" rx="14" fill="#e9ddff" stroke="#334155" stroke-width="2.5"/>
<text x="745.0" y="183.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">double_points:</text>
<text x="745.0" y="209.5" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">points receives 4</text>
<rect x="579" y="319" width="332" height="80" rx="14" fill="#d9f8e3" stroke="#334155" stroke-width="2.5"/>
<text x="745.0" y="365.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">Return points * 2 = 8</text>
<rect x="68" y="319" width="325" height="80" rx="14" fill="#d6eaff" stroke="#334155" stroke-width="2.5"/>
<text x="230.5" y="365.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">main: result receives 8</text>
<rect x="68" y="465" width="325" height="72" rx="14" fill="#d9f8e3" stroke="#334155" stroke-width="2.5"/>
<text x="230.5" y="507.0" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="600" fill="#172033">Print Result: 8</text>
<text x="490" y="585" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#334155">A return value replaces the call expression; main prints it afterward.</text>
</svg>
