<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc"><title id="title">Where a program lives while it runs</title><desc id="desc">The program starts on storage, is loaded into memory, runs on the processor, exchanges input and output with devices, and the operating system manages the shared resources.</desc><rect width="1100" height="430" fill="#fffdf8"/><text x="550" y="50" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#172033">Where a program lives while it runs</text><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs><rect x="40" y="96" width="220" height="120" rx="14" fill="#c3fae8" stroke="#273449" stroke-width="2.5"/><text x="150" y="140" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">storage</text><text x="150" y="183" text-anchor="middle" font-family="monospace" font-size="16" fill="#172033">program file</text><line x1="260" y1="156" x2="323" y2="156" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><text x="291" y="143" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#57534e">run</text><rect x="323" y="96" width="220" height="120" rx="14" fill="#a5d8ff" stroke="#273449" stroke-width="2.5"/><text x="433" y="140" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">memory</text><text x="433" y="183" text-anchor="middle" font-family="monospace" font-size="16" fill="#172033">instructions + data</text><line x1="543" y1="156" x2="606" y2="156" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><rect x="606" y="96" width="220" height="120" rx="14" fill="#d0bfff" stroke="#273449" stroke-width="2.5"/><text x="716" y="140" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">processor</text><text x="716" y="183" text-anchor="middle" font-family="monospace" font-size="16" fill="#172033">follows instructions</text><line x1="826" y1="156" x2="889" y2="156" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><rect x="889" y="96" width="190" height="120" rx="14" fill="#ffd8a8" stroke="#273449" stroke-width="2.5"/><text x="984" y="140" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">input / output</text><text x="984" y="183" text-anchor="middle" font-family="monospace" font-size="16" fill="#172033">keyboard, terminal</text><line x1="889" y1="176" x2="836" y2="176" stroke="#334155" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#tip)"/><text x="862" y="216" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#57534e">results out</text><rect x="323" y="276" width="503" height="94" rx="14" fill="#b2f2bb" stroke="#273449" stroke-width="2.5"/><text x="574" y="316" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">operating system</text><text x="574" y="351" text-anchor="middle" font-family="monospace" font-size="16" fill="#172033">starts programs, shares memory and files, exit status</text><line x1="716" y1="216" x2="690" y2="276" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><line x1="433" y1="276" x2="433" y2="216" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><text x="360" y="250" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#57534e">manages</text><line x1="984" y1="216" x2="840" y2="290" stroke="#334155" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#tip)"/><text x="940" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#57534e">mediates device access</text><text x="150" y="300" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#57534e">power cut?</text><text x="150" y="328" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#57534e">memory is lost,</text><text x="150" y="354" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#57534e">saved files survive</text><line x1="215" y1="328" x2="318" y2="328" stroke="#334155" stroke-width="2" stroke-dasharray="5 5"/><rect x="222" y="316" width="96" height="24" fill="#fffdf8"/><text x="266" y="333" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#57534e">vs</text></svg>
