<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc"><title id="title">A string includes the terminator</title><desc id="desc">The character array for Map holds three letters followed by a null terminator.</desc><rect width="1100" height="350" fill="#fffdf8"/><text x="550" y="55" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#172033">A string includes the terminator</text><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs><rect x="38.0" y="108" width="231.2" height="134" rx="14" fill="#c3fae8" stroke="#273449" stroke-width="2.5"/><text x="153.6" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">index 0</text><text x="153.6" y="199" text-anchor="middle" font-family="monospace" font-size="17" fill="#172033">'M'</text><line x1="269.2" y1="175.0" x2="302.2" y2="175.0" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><rect x="302.2" y="108" width="231.2" height="134" rx="14" fill="#c3fae8" stroke="#273449" stroke-width="2.5"/><text x="417.9" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">index 1</text><text x="417.9" y="199" text-anchor="middle" font-family="monospace" font-size="17" fill="#172033">'a'</text><line x1="533.5" y1="175.0" x2="566.5" y2="175.0" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><rect x="566.5" y="108" width="231.2" height="134" rx="14" fill="#c3fae8" stroke="#273449" stroke-width="2.5"/><text x="682.1" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">index 2</text><text x="682.1" y="199" text-anchor="middle" font-family="monospace" font-size="17" fill="#172033">'p'</text><line x1="797.8" y1="175.0" x2="830.8" y2="175.0" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><rect x="830.8" y="108" width="231.2" height="134" rx="14" fill="#ffd8a8" stroke="#273449" stroke-width="2.5"/><text x="946.4" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">index 3</text><text x="946.4" y="199" text-anchor="middle" font-family="monospace" font-size="17" fill="#172033">'\0'</text><text x="550" y="294" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#273449">sizeof label is 4 bytes; strlen(label) is 3 characters.</text></svg>
