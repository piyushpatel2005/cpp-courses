<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="350" viewBox="0 0 1100 350" role="img" aria-labelledby="title desc"><title id="title">One union slot, two moments</title><desc id="desc">A union member write replaces the active value stored in shared bytes.</desc><rect width="1100" height="350" fill="#fffdf8"/><text x="550" y="55" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="bold" fill="#172033">One union slot, two moments</text><defs><marker id="tip" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs><rect x="38.0" y="108" width="231.2" height="134" rx="14" fill="#c3fae8" stroke="#273449" stroke-width="2.5"/><text x="153.6" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">same slot</text><text x="153.6" y="199" text-anchor="middle" font-family="monospace" font-size="17" fill="#172033">union Entry</text><line x1="269.2" y1="175.0" x2="302.2" y2="175.0" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><rect x="302.2" y="108" width="231.2" height="134" rx="14" fill="#a5d8ff" stroke="#273449" stroke-width="2.5"/><text x="417.9" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">first write</text><text x="417.9" y="199" text-anchor="middle" font-family="monospace" font-size="17" fill="#172033">count = 7</text><line x1="533.5" y1="175.0" x2="566.5" y2="175.0" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><rect x="566.5" y="108" width="231.2" height="134" rx="14" fill="#ffd8a8" stroke="#273449" stroke-width="2.5"/><text x="682.1" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">later write</text><text x="682.1" y="199" text-anchor="middle" font-family="monospace" font-size="17" fill="#172033">grade = 'A'</text><line x1="797.8" y1="175.0" x2="830.8" y2="175.0" stroke="#334155" stroke-width="2.5" marker-end="url(#tip)"/><rect x="830.8" y="108" width="231.2" height="134" rx="14" fill="#b2f2bb" stroke="#273449" stroke-width="2.5"/><text x="946.4" y="152" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#172033">active now</text><text x="946.4" y="199" text-anchor="middle" font-family="monospace" font-size="17" fill="#172033">grade is A</text><text x="550" y="294" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#273449">The count and grade are not stored simultaneously in this union.</text></svg>
